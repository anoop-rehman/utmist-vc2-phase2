# D3 M3 E3.1 SECOND ARM (floor + sigma), seed 2. Design stages LIVE, on CompetEvo's 1v1
# run-to-goal against the scripted opponent, under E2.1's `d2rep` regime.
#
# E3 (`rtg_e3_s*`) ran this exact configuration with `control_log_std: 0` and
# the design search DELETED EVERY ACTUATOR -- p_act4 = 0.000 on 3 of 3 seeds by
# epoch 17, not one design in 600 with four motors. The mechanism is the DENSE
# control cost: at log_std 0 a fresh policy pays ~3.89/step against a 1.0
# survive bonus, and deleting the actuators makes 0.5*sum(a^2) exactly 0
# forever, which is a faster route than learning small actions. Measured: the
# GNN's sigma falls at ~-0.006/epoch, so route 1 needs ~125 epochs where route
# 2 took 17. See `D3_E3_ADVERSARIAL.md` sections 3e and 3f.
#
# THE FIX, derived before running (section 3f):
#   cost_crit           0.6831 / step
#   log_std_crit       -0.8837 analytic, -0.9645 MEASURED on the simulator
# `control_log_std: -1.5` gives sigma 0.223 and cost 0.198/step -- 0.536 below
# the empirical boundary, against -1.0's 0.036. Chosen over -1.0 because the
# exploration cost that would justify staying high does not exist in this
# range: path travelled by noise alone is flat at 3.60-4.36 m across sigma
# 0.41 -> 0.17 with no monotone trend.
#
# THIS ARM ALSO CARRIES THE STRUCTURAL FLOOR: `env_specs.min_motors: 4` blocks
# any skeleton removal that would take the robot below four actuators (one per
# original leg, the minimum that could plausibly walk). Section 3f-iii measured
# the floor ALONE as insufficient -- at log_std 0 a 4-motor ant pays 2.0/step
# so falling early still beats standing -- but free once the sigma fix is in
# place, and it removes the failure mode structurally rather than pricing it.
# Grid margin: +210.3 against the sigma fix alone at +86.2.
#
# Diff against `rtg_e3_s2.yml` is the whole experimental delta.
env_name: run_to_goal
agent_specs:
  batch_design: true
  # [every, until]: also save at epochs 20/40/60/80/100.
  additional_saves: [20, 100]
# training parameters
gamma: 0.995
tau: 0.95
policy_specs:
  name: v5
  htype: tanh
  skel_gnn_specs:
    layer_type: graph_conv
    hdims: [64, 64, 64]
    aggr: add
    bias: true
  skel_index_mlp:
    hdims: [128, 128]
    rescale_linear: true
  control_gnn_specs:
    layer_type: graph_conv
    hdims: [64, 64, 64]
    aggr: add
    bias: true
  control_index_mlp:
    hdims: [128, 128]
    rescale_linear: true
  attr_gnn_specs:
    layer_type: graph_conv
    hdims: [64, 64, 64]
    aggr: add
    bias: true
  attr_index_mlp:
    hdims: [128, 128]
    rescale_linear: true
  control_log_std: -1.5
  attr_log_std: -2.3
  fix_control_std: false
  fix_attr_std: false
policy_optimizer: 'Adam'
policy_lr: 5.e-5
policy_momentum: 0.0
policy_weightdecay: 0.0
value_specs:
  htype: tanh
  design_flag_in_state: true
  onehot_design_flag: true
  mlp: [512, 256]
  gnn_specs:
    layer_type: graph_conv
    hdims: [64, 64, 64]
    aggr: add
    bias: true
value_optimizer: 'Adam'
value_lr: 3.e-4
value_momentum: 0.0
value_weightdecay: 0.0
clip_epsilon: 0.2
min_batch_size: 50000
mini_batch_size: 2048
num_optim_epoch: 10
max_epoch_num: 400
seed: 2
save_model_interval: 100


robot_param_scale: 1
skel_transform_nsteps: 5

env_specs:
  model_xml_file: 'assets/mujoco_envs/rtg_ant.xml'
  init_height: false
  # CompetEvo's control rate: timestep 0.003 (in the asset) x frame_skip 5
  # = dt 0.015 s, so 500 control steps is their 7.5 s episode.
  frame_skip: 5
  # The scripted opponent's speed, m/s. 5.0 m / 7.5 s = 0.667 is the speed
  # the 500-step clock already demands; 0.68 is that advanced 2%, so the
  # opponent CROSSES at control step 491 and running out of time is realised
  # as a loss rather than as a silent truncation. See
  # `design_opt/envs/run_to_goal.py`'s docstring.
  # D3 M3 E3.1 second arm: structural floor on actuator count.
  min_motors: 4
  opponent_speed: 0.68
  goal_x: 4.0
  stand_z: 0.28
  # D3 M3 E3: `force_identity_design` is ABSENT here -- that
  # is the experiment. `AntEnv.step` defaults it to False, so
  # the skeleton and attribute actions the policy emits are
  # applied to the body for real.

done_condition:
  # CompetEvo's truncation (multi_agent_env.py:77). Transform2Act's max_ang /
  # min_height / max_height are deliberately NOT set: this task has its own
  # termination rule (a fall below z=0.28, a goal, a non-finite state) and two
  # rules for one task would be untraceable.
  max_nsteps: 500

obs_specs:
  attr: ['depth']
  sim: []
  design: true
  clip_qvel: true
  use_projected_params: true
  use_body_ind: true
max_body_depth: 4

add_body_condition:
  max_nchild: 2

robot:
  param_mapping: sin
  no_root_offset: true
  
  body_params:
    offset:
      type: 'xy'
      lb: [-0.5, -0.5]
      ub: [0.5, 0.5]

  joint_params: {}

  geom_params:
    size:
      lb: 0.03
      ub: 0.10
    ext_start:
      lb: 0.0
      ub: 0.2

  actuator_params:
    gear:
      lb: 20
      ub: 400
  

